[project]
name = "iperson"
version = "0.2.0"
description = "Universal AI-powered Personal IP Operation Platform"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "tenacity>=8.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.1",
    "langchain-anthropic>=1.4.3",
    "langgraph>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
openai = [
    "openai>=1.0",
]
anthropic = [
    "anthropic>=0.30",
]
gemini = [
    "langchain-google-genai>=2.0",
]
all = [
    "iperson[openai,anthropic,gemini,dev]",
]

[project.scripts]
iperson = "iperson.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]